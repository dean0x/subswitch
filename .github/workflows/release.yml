name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: setup-node then writes no npm token line to .npmrc.
      # No npm cache: this job can sign in to npm, so it restores no cached files.
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # This job can sign in to npm, so no dependency runs an install script here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify package-lock.json version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          if [ "${LOCK_VERSION}" != "${PKG_VERSION}" ]; then
            echo "package-lock.json version ${LOCK_VERSION} does not match package.json version ${PKG_VERSION}" >&2
            echo "Run: npm install --package-lock-only" >&2
            exit 1
          fi
          if [ "${LOCK_PKG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "package-lock.json packages[\"\"].version ${LOCK_PKG_VERSION} does not match package.json version ${PKG_VERSION}" >&2
            echo "Run: npm install --package-lock-only" >&2
            exit 1
          fi

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test tarball
        run: ./scripts/smoke-tarball.sh

      # npm trusted publishing: npm signs in with the workflow identity (OIDC).
      # The job has no npm token, so the publish can not fall back to one.
      # test/unit/release-workflow.test.ts keeps all workflows token-free.
      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 has npm 10,
      # so this step runs a pinned npm 11 through npx.
      - name: Publish
        run: npx -y npm@11.19.1 publish --provenance --access public
